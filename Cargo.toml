[workspace]
resolver = "2"
members = ["crates/simtara-core", "crates/simtara-particles", "crates/simtara-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1
